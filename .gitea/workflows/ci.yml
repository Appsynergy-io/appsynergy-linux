name: ci
on:
  push:
    branches: ['**']
  pull_request:

# The pipeline IS scripts/check.sh — run it locally before every commit.
# CI just executes the same gate on a runner (none registered yet; this file
# activates the moment one is — see task: k3s act_runner Deployment).
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: deps
        run: pacman -Syu --noconfirm --needed git base-devel shellcheck namcap rust
      - uses: actions/checkout@v4
      - name: gate
        run: |
          useradd -m build
          chown -R build .
          runuser -u build -- ./scripts/check.sh
