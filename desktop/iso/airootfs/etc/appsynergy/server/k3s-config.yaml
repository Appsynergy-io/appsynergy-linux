# Single-node K3s. Host firewall uses this pod CIDR; change both together.
cluster-cidr: "10.42.0.0/16"
service-cidr: "10.43.0.0/16"
# Keep the host (sshd, journald, k3s itself) schedulable when pods fill the
# node. Accounting only: no cgroup is enforced on system services.
kubelet-arg:
  - "system-reserved=cpu=250m,memory=512Mi"
  - "kube-reserved=cpu=250m,memory=512Mi"
  - "image-gc-high-threshold=80"
  - "image-gc-low-threshold=70"
disable:
  - traefik
  - servicelb
secrets-encryption: true
write-kubeconfig-mode: "0600"
