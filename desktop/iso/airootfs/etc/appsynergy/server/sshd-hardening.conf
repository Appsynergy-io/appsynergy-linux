# /etc/ssh/sshd_config.d/10-appsynergy.conf
# Host SSH (post-boot). Initramfs dropbear is separate (key-only, unlock shell).
# From appsynergy-linux break-glass posture: key auth, no password, no empty.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
X11Forwarding no
AllowTcpForwarding yes
AllowAgentForwarding no
ClientAliveInterval 30
ClientAliveCountMax 3
LoginGraceTime 30
MaxAuthTries 3
# Optional lock-down after you pin users:
# AllowUsers root imma
