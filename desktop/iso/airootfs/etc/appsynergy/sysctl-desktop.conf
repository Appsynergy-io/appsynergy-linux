# /etc/sysctl.d/99-appsynergy-desktop.conf
# Workstation. Installed by appsynergy-install.

# zram is the only swap device (zram-generator.conf). Compressed RAM is cheaper
# than re-reading page cache, so prefer it; no readahead on a RAM device.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Bound dirty writeback so one large copy cannot stall the desktop.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Editors, language servers and file sync watch whole source trees.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 1048576
vm.max_map_count = 1048576

kernel.kptr_restrict = 1
kernel.yama.ptrace_scope = 1
