#!/usr/sbin/nft -f
# Fail-closed host baseline (from appsynergy-linux sg-baseline, no agent/mgmt-gate).
#
# Replace only this table — never `flush ruleset`, which would take out the
# agent's own tables and Docker's. The two lines below are one idempotent
# idiom: `table` creates it when absent so the `delete` cannot fail on a
# fresh boot, and the delete makes a reload replace the ruleset instead of
# appending a second copy of every rule (measured on nftables v1.1.6: without
# it, `nft -f` twice leaves `ct state established,related accept` twice and
# leaves withdrawn rules in place). Both run in one transaction with the
# table below, so there is no window where the policy is not drop.
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    # DHCPv4 client replies (broadcast; not conntracked as related)
    udp dport 68 accept
    # Break-glass / admin SSH (post-boot openssh; initrd dropbear is pre-nft)
    tcp dport 22 accept
    icmp type echo-request accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert, echo-request } accept
    # WireGuard listen — uncomment when endpoint is live
    # udp dport 51820 accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept

    # Customer traffic on the tunnel appliance. Both rules must live in THIS
    # chain: base chains at one hook are evaluated independently, so an accept
    # in the agent's own table does not override the drop policy here — a
    # static-IP flow passed only once the accept was in this chain.
    #
    # 1. Inbound to a customer's static IP. The router agent DNATed it in
    #    prerouting to the peer's overlay address, and the host forwards it
    #    into the veth of the WG container holding that peer. `ct status dnat`
    #    is the authorisation: the DNAT rule exists only while the binding is
    #    active, so a packet addressed straight at an overlay address — no
    #    binding to rewrite it — is dropped, and inbound stops the moment the
    #    binding is withdrawn. Replies are covered by the established rule.
    iifname "en*" oifname "v-wg*" ct status dnat accept
    # 2. Peer-to-peer between WG containers. One flat overlay with a netns per
    #    server means the host routes between them, over the per-peer /32s the
    #    router agent installs into each veth.
    iifname "v-wg*" oifname "v-wg*" accept
    # Customer egress to the internet is NATed inside the WG container's own
    # namespace and leaves on its ipvlan child, so it never reaches this chain.
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
