#!/usr/sbin/nft -f
# Single-node K3s baseline. K3s owns service NAT and NetworkPolicy rules.
# Never flush the whole ruleset: reload only the host table.
# For multiple nodes, populate cluster_nodes with their private IPv4 addresses
# on EVERY node. Do not expose VXLAN (8472/udp) to the public Internet.
# Keep pod CIDRs here in sync with /etc/rancher/k3s/config.yaml.
table inet appsynergy_host
delete table inet appsynergy_host

table inet appsynergy_host {
  set cluster_nodes { type ipv4_addr; flags interval; }
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    udp sport 67 udp dport 68 accept
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 accept
    # Pods need the Kubernetes API, and metrics-server scrapes the kubelet
    # (10250, authenticated) on the node address; source + interface prevent
    # WAN spoofing.
    iifname { "cni0", "flannel.1" } ip saddr 10.42.0.0/16 tcp dport { 6443, 10250 } accept
    ip saddr @cluster_nodes tcp dport { 6443, 10250, 2379, 2380 } accept
    ip saddr @cluster_nodes udp dport 8472 accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    # Pod DNS/services/egress. K3s NetworkPolicy drop verdicts still apply.
    iifname { "cni0", "flannel.1" } ip saddr 10.42.0.0/16 accept
    # Services explicitly published by K3s (NodePort/hostPort DNAT).
    oifname { "cni0", "flannel.1" } ip daddr 10.42.0.0/16 ct status dnat accept
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
