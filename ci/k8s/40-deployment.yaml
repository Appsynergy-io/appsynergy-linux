# The runner itself. Apply last: it consumes the ConfigMap, the three PVCs and
# the Secret `act-runner-reg` (created out-of-band — see ci/README.md; the token
# value must never enter this repo, a shell history, or a file on disk).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: ci
  labels:
    app.kubernetes.io/name: act-runner
spec:
  replicas: 1
  # Recreate, never RollingUpdate: registration state is one file on one RWO
  # volume. Two act_runner processes on it race the same registration and Gitea
  # deregisters the loser, which reads as "runner vanished mid-rollout".
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: act-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: act-runner
    spec:
      # No priorityClassName: default priority 0. This runner must never preempt
      # control-plane, gitea, mail, monitoring, router or wg.
      automountServiceAccountToken: false
      # The Gitea package IS private — an anonymous manifest GET returns 401, so
      # the kubelet cannot pull without credentials. The Secret is created
      # out-of-band (see ci/README.md; the token never lands in this repo):
      #   kubectl -n ci create secret docker-registry gitea-registry \
      #     --docker-server=git.appsynergy.io --docker-username=imabee \
      #     --docker-password=<token from sdx, piped, never echoed>
      imagePullSecrets:
        - name: gitea-registry
      # > runner.shutdown_timeout (5m) in the ConfigMap, so a job in flight is
      # drained by act_runner rather than SIGKILLed by the kubelet.
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: act-runner
          # Repin to a digest after the first push: `podman image inspect --format
          # '{{index .RepoDigests 0}}'`. Tag tracks act_runner version + image rel.
          image: git.appsynergy.io/imabee/appsynergy-ci-runner:0.2.13-1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONFIG_FILE
              value: /etc/act_runner/config.yaml
            - name: GITEA_INSTANCE_URL
              # Public address on purpose: Gitea holds a multus public IP and has
              # no ClusterIP Service, so no in-cluster name resolves to it.
              value: https://git.appsynergy.io
            # Stable name, not the pod name: the pod name changes on every restart
            # and would register a second runner if /data/.runner were ever lost.
            - name: RUNNER_NAME
              value: k3s-arch-host
            - name: RUNNER_LABELS
              value: arch-host:host
            - name: RUNNER_FILE
              value: /data/.runner
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-reg
                  key: token
                  # optional: registration is one-shot. Once /data/.runner exists
                  # the Secret can be deleted and the pod still starts.
                  optional: true
            - name: HOME
              value: /home/build
            - name: CARGO_HOME
              value: /cache/cargo
            - name: RUSTUP_HOME
              value: /opt/rustup
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              # 4 of 8 cores: makepkg/cargo saturate what they are given, and the
              # node runs production workloads alongside.
              cpu: "4"
              memory: 8Gi
              # Caps the emptyDirs + image layer growth; the build trees live on
              # PVCs, which do not count against this.
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: work
              mountPath: /data
            - name: cargo-cache
              mountPath: /cache/cargo
            - name: pacman-cache
              mountPath: /var/cache/pacman/pkg
            - name: config
              mountPath: /etc/act_runner
              readOnly: true
            # readOnlyRootFilesystem needs these two writable: check.sh writes
            # /tmp/check-stage.log and makepkg/cargo use TMPDIR; git and the
            # toolchain proxies touch $HOME.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/build
      # No probes: act_runner exposes no health endpoint (its cache server binds
      # loopback only), and a dead process exits — the kubelet restarts it.
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: act-runner-work
        - name: cargo-cache
          persistentVolumeClaim:
            claimName: act-runner-cargo-cache
        - name: pacman-cache
          persistentVolumeClaim:
            claimName: act-runner-pacman-cache
        - name: config
          configMap:
            name: act-runner-config
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: home
          emptyDir:
            sizeLimit: 2Gi
