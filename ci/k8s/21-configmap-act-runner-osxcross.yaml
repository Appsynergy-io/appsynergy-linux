# act_runner config for the OSXCross darwin runner.
# Label osxcross-host:host must match runs-on: and the Gitea runner label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-osxcross-config
  namespace: ci
data:
  config.yaml: |
    log:
      level: info

    runner:
      file: /data/.runner
      # capacity 1 + Deployment limits (4 CPU / 8Gi) = don't choke the box.
      capacity: 1
      timeout: 3h
      shutdown_timeout: 5m
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      report_interval: 1s
      labels:
        - "osxcross-host:host"
      envs:
        CARGO_HOME: /cache/cargo
        RUSTUP_HOME: /opt/rustup
        PATH: /opt/osxcross/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin
        SDKROOT: /sdk
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        CC_aarch64_apple_darwin: oa64-clang
        CXX_aarch64_apple_darwin: oa64-clang++
        CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: oa64-clang

    cache:
      enabled: true
      dir: /data/cache
      host: "127.0.0.1"
      port: 8088

    container:
      docker_host: "-"
      privileged: false
      force_pull: false

    host:
      workdir_parent: /data/work
