# Applied before the workload so the runner is never briefly unpoliced.
# This cluster enforces NetworkPolicy for real — a mistake here silently strands
# the runner in "polling" with no jobs, or breaks cargo/pacman mid-build.
---
# Ingress: deny everything. Nothing dials the runner; act_runner polls Gitea.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ci
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Egress: DNS, plus outbound 80/443 to the public internet only.
#
# Broad 0.0.0.0/0 on 443 is unavoidable and deliberate: this runner builds Arch
# packages and a Rust tree, so it must reach the Arch mirror pool (hundreds of
# rotating hosts, resolved per request), crates.io + its CDN, dl.gitea.com, and
# Gitea itself. Narrowing to fixed CIDRs would break on the first mirror rotation.
# The honest boundary is therefore not "which hosts" but "not the cluster":
# RFC1918, the k3s pod/service CIDRs and link-local (169.254.169.254 metadata)
# are excluded, so a compromised job cannot reach kube-apiserver, the gitea/mail/
# monitoring/router/wg workloads, or the node's private plane.
#
# Gitea is reached over its PUBLIC address (64.112.14.30, multus) — there is no
# ClusterIP Service for it, so no in-cluster exception is needed or wanted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-public-web
  namespace: ci
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16      # k3s pod CIDR
              - 10.43.0.0/16      # k3s service CIDR (kube-apiserver included)
              - 10.0.0.0/8        # RFC1918
              - 172.16.0.0/12     # RFC1918
              - 192.168.0.0/16    # RFC1918
              - 169.254.0.0/16    # link-local + cloud metadata
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
