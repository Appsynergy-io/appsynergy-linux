# Storage for the OSXCross runner. local-path WaitForFirstConsumer — Pending
# until the Deployment schedules is expected.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-osxcross-work
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-osxcross-cargo-cache
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
