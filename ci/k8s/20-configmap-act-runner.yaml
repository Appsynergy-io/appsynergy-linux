# act_runner 0.2.13 configuration. Mounted read-only at /etc/act_runner/config.yaml;
# the Deployment points CONFIG_FILE at it.
#
# Self-consistency contract: the label declared here is `arch-host:host`, which
# must equal `runs-on:` in .gitea/workflows/ci.yml and the label the operator sees
# in Gitea > Settings > Actions > Runners. Change one, change all three.
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-config
  namespace: ci
data:
  config.yaml: |
    log:
      level: info

    runner:
      # Registration state on the work PVC. Absolute: the daemon's cwd is /data
      # but a relative path here would follow any future workdir change.
      file: /data/.runner
      # capacity 1 = one job at a time. This is the "don't choke the box" control:
      # a check.sh run is makepkg x6 plus a cargo build, and the node also hosts
      # gitea/mail/monitoring/router/wg. Raising this raises peak load linearly.
      capacity: 1
      timeout: 3h
      shutdown_timeout: 5m
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      report_interval: 1s
      # `:host` = execute in this pod's own Arch userland. No docker, no LXC:
      # k3s is the only runtime, so there is nothing else to exec into.
      labels:
        - "arch-host:host"
      envs:
        CARGO_HOME: /cache/cargo
        RUSTUP_HOME: /opt/rustup
        PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin

    cache:
      enabled: true
      # Actions cache blobs on the work PVC.
      dir: /data/cache
      # Bind and advertise loopback: host-mode jobs share this pod's network
      # namespace, so the cache never crosses the pod boundary — which is what
      # keeps the default-deny ingress NetworkPolicy from breaking it.
      host: "127.0.0.1"
      port: 8088

    container:
      # Unused in host mode. docker_host "-" hard-disables socket discovery so a
      # workflow that asks for a container fails loudly instead of finding a daemon.
      docker_host: "-"
      privileged: false
      force_pull: false

    host:
      # Job workspaces on the work PVC; act_runner prunes per-job dirs itself.
      workdir_parent: /data/work
