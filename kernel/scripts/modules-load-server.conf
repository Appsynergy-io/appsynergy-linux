# /etc/modules-load.d/appsynergy-server.conf
# Ensure conntrack sysctl keys exist before systemd-sysctl
nf_conntrack
nf_tables
# br_netfilter is what makes bridged frames traverse the netfilter forward hook.
# Without it nft accepts the ruleset, the counters stay at zero, and filtering
# silently does nothing — so the host perimeter and every k3s NetworkPolicy
# depend on this module being loaded, not merely built.
br_netfilter
