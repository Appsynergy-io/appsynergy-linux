# /etc/sysctl.d/99-appsynergy-server.conf
# Tunnel / WG / nftables host. Pair with configs/server.fragment.
# Install: sudo install -m644 scripts/sysctl-server.conf /etc/sysctl.d/99-appsynergy-server.conf
#          sudo sysctl --system

# Forwarding (WireGuard router / policy routes). nftables is the real ACL —
# enable forwarding only after a default-drop forward policy is in place.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# Egress pacing + WAN TCP (kernel has FQ + BBR built-in)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# UDP/QUIC / WG bursts
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 1048576
net.core.netdev_max_backlog = 16384
net.core.netdev_budget = 600
net.core.somaxconn = 4096
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# Conntrack (load nf_conntrack before sysctl; modules-load.d)
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_tcp_timeout_established = 86400

# Memory: bound dirty writeback; allow high map count for Rust/async
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_expire_centisecs = 1000
vm.watermark_scale_factor = 150
vm.max_map_count = 1048576
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Unprivileged BPF off (kernel default); keep for attack surface
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Less ASLR noise in logs; keep mitigations
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0
