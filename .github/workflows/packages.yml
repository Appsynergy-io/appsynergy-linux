name: packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/pkgbuilds/**'
      - 'packages/scripts/**'
      - 'packages/pacman/**'
      - '.github/workflows/packages.yml'

# Build any/ packages, pull the last sandbox-uploaded kernel from the rolling
# Release, sign, repo-add, publish. Never compiles the kernel. Never touches ISO.
concurrency:
  group: publish-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git github-cli gnupg curl sudo
          id -u build >/dev/null 2>&1 || useradd -m -u 1000 build
      - uses: actions/checkout@v4
      - name: import signing key
        env:
          APPSYNERGY_GPG_KEY: ${{ secrets.APPSYNERGY_GPG_KEY }}
          APPSYNERGY_GPG_PASSPHRASE: ${{ secrets.APPSYNERGY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "${APPSYNERGY_GPG_KEY:-}" ]] || { echo "APPSYNERGY_GPG_KEY secret missing"; exit 1; }
          install -d -m 700 -o build -g build /home/build/.gnupg
          runuser -u build -- env \
            GNUPGHOME=/home/build/.gnupg \
            APPSYNERGY_GPG_KEY="$APPSYNERGY_GPG_KEY" \
            APPSYNERGY_GPG_PASSPHRASE="${APPSYNERGY_GPG_PASSPHRASE:-}" \
            bash -c '
            set -euo pipefail
            umask 077
            printf "%s\n" "$APPSYNERGY_GPG_KEY" | gpg --batch --import
            if [[ -n "${APPSYNERGY_GPG_PASSPHRASE:-}" ]]; then
              printf "pinentry-mode loopback\n" > "$GNUPGHOME/gpg.conf"
              printf "%s\n" "$APPSYNERGY_GPG_PASSPHRASE" > "$GNUPGHOME/pass"
              chmod 600 "$GNUPGHOME/gpg.conf" "$GNUPGHOME/pass"
            fi
          '
      - name: pull kernel + build + publish
        env:
          GPGKEY: 3B90D92D1E28E9E060D5C53D15D4351CF0D36AD1
          SIGN: "1"
          GNUPGHOME: /home/build/.gnupg
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chown -R build:build "$GITHUB_WORKSPACE"
          pass=()
          if [[ -f /home/build/.gnupg/pass ]]; then
            pass=(GPG_PASSPHRASE_FILE=/home/build/.gnupg/pass)
          fi
          as_build() {
            runuser -u build -- env \
              GPGKEY="$GPGKEY" SIGN=1 GNUPGHOME=/home/build/.gnupg \
              GH_TOKEN="${GH_TOKEN:-}" GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
              "${pass[@]}" \
              "$@"
          }
          as_build ./packages/scripts/pull-kernel.sh
          as_build ./packages/scripts/build-repo.sh
          as_build ./packages/scripts/publish-repo.sh
