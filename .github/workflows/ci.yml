name: ci
# The one workflow. check = scripts/check.sh on every PR and every push to
# main; publish runs after check, on main only, and is idempotent — when the
# published database already describes the staged packages it uploads nothing.
# scripts/check.sh stage `workflows` fails if a second file appears here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Arch userland in a container: makepkg refuses uid 0, so the gate runs as `build`.
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6 # digest mirrors ci/gha/Containerfile; check.sh stage ci-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches restore on every run and save on main only, so a PR never
      # writes a cache a later PR restores. A miss costs minutes, never
      # correctness: pacman verifies every package signature, rustup every
      # toolchain hash, cargo every lockfile checksum.
      - name: cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: restore pacman cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ steps.week.outputs.week }}
          restore-keys: pacman-
      - name: restore rust caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/rustup
            /home/build/.cargo/registry
            desktop/installer/target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/installer/rust-toolchain.toml', 'desktop/installer/Cargo.lock') }}
      - name: deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git shellcheck namcap rustup nodejs curl sudo actionlint zizmor \
            cargo-audit cargo-deny gitleaks
          # Shared toolchain: Arch cargo/rustc are rustup proxies. Install as
          # root into /opt so uid 1000 `build` can run makepkg-adjacent cargo test.
          # The version is the one desktop/installer/rust-toolchain.toml pins.
          export RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo
          mkdir -p /opt/rustup /opt/cargo
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' desktop/installer/rust-toolchain.toml)
          [[ -n "$toolchain" ]] || { echo "rust-toolchain.toml has no channel"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --no-self-update \
            --component rustfmt --component clippy
          rustup default "$toolchain"
          chmod -R a+rX /opt/rustup /opt/cargo
          id -u build >/dev/null 2>&1 || useradd -m -u 1000 build
      - name: gate
        env:
          RUSTUP_HOME: /opt/rustup
          CARGO_HOME: /home/build/.cargo
        run: |
          set -euo pipefail
          chown -R build:build "$GITHUB_WORKSPACE"
          install -d -o build -g build /home/build/.cargo
          chown -R build:build /home/build   # restored registry cache arrives root-owned
          runuser -u build -- env RUSTUP_HOME=/opt/rustup CARGO_HOME=/home/build/.cargo \
            ./scripts/check.sh
      - name: save pacman cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ steps.week.outputs.week }}
      - name: save rust caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/rustup
            /home/build/.cargo/registry
            desktop/installer/target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/installer/rust-toolchain.toml', 'desktop/installer/Cargo.lock') }}

  dependabot-automerge:
    name: dependabot auto-merge
    # Arms auto-merge on every Dependabot PR so it lands the moment `check`
    # passes under the main ruleset. Dependabot runs get a read-only token
    # unless the job declares permissions; nothing is checked out here. A
    # merge by GITHUB_TOKEN does not trigger the push-to-main run, so a
    # dependency bump skips publish (it changes no package) and cache saves.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: arm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  publish:
    name: publish
    # Build any/ packages, pull the last sandbox-uploaded kernel from the rolling
    # Release, sign, repo-add, publish. Never compiles the kernel. Never touches
    # the ISO. Gated on check: nothing the gate rejects reaches the Release.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: repo-x86_64
      url: https://github.com/Appsynergy-io/appsynergy-linux/releases/tag/repo-x86_64
    concurrency:
      group: publish-repo
      cancel-in-progress: false
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6 # digest mirrors ci/gha/Containerfile; check.sh stage ci-image
    steps:
      - name: cache week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: restore pacman cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ steps.week.outputs.week }}
          restore-keys: pacman-
      - name: deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git github-cli gnupg curl sudo
          id -u build >/dev/null 2>&1 || useradd -m -u 1000 build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kernel is ~200MB per publish and changes only when the sandbox
      # uploads a new one. Key on the Release's own asset list; pull-kernel.sh
      # skips any file whose size matches what the Release reports.
      - name: kernel asset key
        id: kernel
        run: |
          set -euo pipefail
          base=$(sed -n '1p' packages/pacman/SERVER | tr -d '[:space:]')
          [[ "$base" =~ ^https://github.com/([^/]+)/([^/]+)/releases/download/([^/]+)$ ]]
          key=$(curl -fsSL "https://api.github.com/repos/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}/releases/tags/${BASH_REMATCH[3]}" \
            | awk -F'"' '/"name":/ && $4 ~ /^appsynergy-linux.*\.pkg\.tar\.zst(\.sig)?$/ { n=$4 }
                         n && /"size":/ { gsub(/[^0-9]/, "", $3); print n, $3; n="" }' \
            | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: cache kernel assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/repo/x86_64/appsynergy-linux-*
          key: kernel-${{ steps.kernel.outputs.key }}
      - name: import signing key
        env:
          APPSYNERGY_GPG_KEY: ${{ secrets.APPSYNERGY_GPG_KEY }}
          APPSYNERGY_GPG_PASSPHRASE: ${{ secrets.APPSYNERGY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "${APPSYNERGY_GPG_KEY:-}" ]] || { echo "APPSYNERGY_GPG_KEY secret missing"; exit 1; }
          install -d -m 700 -o build -g build /home/build/.gnupg
          # shellcheck disable=SC2016  # the body expands inside the child shell, as build
          runuser -u build -- env \
            GNUPGHOME=/home/build/.gnupg \
            APPSYNERGY_GPG_KEY="$APPSYNERGY_GPG_KEY" \
            APPSYNERGY_GPG_PASSPHRASE="${APPSYNERGY_GPG_PASSPHRASE:-}" \
            bash -c '
            set -euo pipefail
            umask 077
            printf "%s\n" "$APPSYNERGY_GPG_KEY" | gpg --batch --import
            if [[ -n "${APPSYNERGY_GPG_PASSPHRASE:-}" ]]; then
              printf "pinentry-mode loopback\n" > "$GNUPGHOME/gpg.conf"
              printf "%s\n" "$APPSYNERGY_GPG_PASSPHRASE" > "$GNUPGHOME/pass"
              chmod 600 "$GNUPGHOME/gpg.conf" "$GNUPGHOME/pass"
            fi
          '
      - name: pull kernel + build + publish
        env:
          GPGKEY: 3B90D92D1E28E9E060D5C53D15D4351CF0D36AD1
          SIGN: "1"
          GNUPGHOME: /home/build/.gnupg
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chown -R build:build "$GITHUB_WORKSPACE"
          pass=()
          if [[ -f /home/build/.gnupg/pass ]]; then
            pass=(GPG_PASSPHRASE_FILE=/home/build/.gnupg/pass)
          fi
          as_build() {
            runuser -u build -- env \
              GPGKEY="$GPGKEY" SIGN=1 GNUPGHOME=/home/build/.gnupg \
              GH_TOKEN="${GH_TOKEN:-}" GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
              "${pass[@]}" \
              "$@"
          }
          as_build ./packages/scripts/pull-kernel.sh
          as_build ./packages/scripts/build-repo.sh
          as_build ./packages/scripts/publish-repo.sh
      - name: tag the publish
        # publish-repo.sh leaves the snapshot stamp in staging when it uploaded
        # something. Tag published/<stamp> on this commit so the dated db on the
        # Release names the source that produced it. A GITHUB_TOKEN tag push
        # triggers nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=packages/repo/x86_64/.published-stamp
          [[ -f "$f" ]] || { echo "nothing published — no tag"; exit 0; }
          stamp=$(tr -d '[:space:]' < "$f")
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/published/$stamp" -f sha="$GITHUB_SHA" >/dev/null
          echo "tagged published/$stamp"
