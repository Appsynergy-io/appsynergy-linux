version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop/installer
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /ci/gha
    schedule:
      interval: monthly
