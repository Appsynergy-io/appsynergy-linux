# Include from pacman.conf after [options] or as a full repo block.
# Also set under [options] (required for Gitea package API downloads):
#   XferCommand = /usr/bin/curl -L -C - -f --connect-timeout 30 --retry 3 -o %o %u

[appsynergy]
SigLevel = Optional TrustAll
