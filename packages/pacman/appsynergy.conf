# Reference copy of the section appsynergy-mirrorlist ships as
# /etc/pacman.conf.d/appsynergy.conf. pacman has no pacman.conf.d convention, so
# /etc/pacman.conf must Include this file explicitly; the package appends that
# Include last, keeping [appsynergy] below core/extra in priority order.
#
# Also set under [options] (required for Gitea package API downloads):
#   XferCommand = /usr/bin/curl -L -C - -f --connect-timeout 30 --retry 3 -o %o %u
#
# Signatures are enforced: add key 3B90D92D1E28E9E060D5C53D15D4351CF0D36AD1 with
# pacman-key before the first sync, or every transaction fails on an unknown key.

[appsynergy]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/appsynergy-mirrorlist
