[appsynergy]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/appsynergy-mirrorlist

# Signed by the same key as [appsynergy] (appsynergy-keyring), but its own
# database: sdx publishes from its own CI, appsynergy-repo from a workstation,
# and two writers on one db is how a repo loses a package.
[sdx]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/sdx-mirrorlist
